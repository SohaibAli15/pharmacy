spring.application.name=pharmacy

# API Versioning
api.version=v1
api.base-path=/api/${api.version}

server.port=${PORT:8080}
# Default dev profile: use H2 in-memory database so the app starts without external DB
#spring.datasource.url=jdbc:h2:mem:pharmacydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.username=sa
#spring.datasource.password=sa
#spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.url=jdbc:postgresql://localhost:5433/pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB
file.upload-dir=uploads

# Disable Micrometer tracing auto-config to avoid Brave/OpenTelemetry bean conflict during development
management.tracing.enabled=false

# Disable OTLP metrics export (avoids connection refused errors to metrics collector)
management.metrics.export.otlp.enabled=false

# Disable Redis session management for development
spring.session.store-type=none

# Suppress noisy connection error logging
logging.level.io.micrometer.registry.otlp=ERROR
logging.level.org.springframework.data.redis=ERROR
logging.level.com.zaxxer.hikari=WARN

# As a safety-net, exclude the Micrometer tracing auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.micrometer.tracing.autoconfigure.MicrometerTracingAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.main.lazy-initialization=true
# Note: Postgres connection details are in application-postgres.properties (use -Dspring.profiles.active=postgres to enable)

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.packagesToScan=com.pharmacy.controller
springdoc.pathsToMatch=/api/**

jwt.secret=pharmacy-2026-very-strong-secret-key-1234567890abcd
