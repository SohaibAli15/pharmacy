spring.application.name=pharmacy

# Default dev profile: use H2 in-memory database so the app starts without external DB
spring.datasource.url=jdbc:h2:mem:pharmacydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Micrometer tracing auto-config to avoid Brave/OpenTelemetry bean conflict during development
management.tracing.enabled=false

# As a safety-net, exclude the Micrometer tracing auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.micrometer.tracing.autoconfigure.MicrometerTracingAutoConfiguration

# Note: Postgres connection details are in application-postgres.properties (use -Dspring.profiles.active=postgres to enable)
