# Railway-specific application profile for memory optimization
spring.application.name=pharmacy

# Server Configuration
server.port=${PORT:8080}
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100

# Database (Railway PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# HikariCP Connection Pool (Optimized for low memory)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Disable ALL unnecessary features to save memory
management.tracing.enabled=false
management.metrics.export.otlp.enabled=false
spring.session.store-type=none
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Disable heavy auto-configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.micrometer.tracing.autoconfigure.MicrometerTracingAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.tracing.BraveAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryAutoConfiguration

# Lazy initialization to reduce startup memory
spring.main.lazy-initialization=true

# Disable Actuator endpoints except health (save memory)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health

# Logging (Minimal for production)
logging.level.root=WARN
logging.level.com.pharmacy=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.io.micrometer=ERROR
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Swagger/OpenAPI (Enable for API documentation)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.pharmacy.controller
springdoc.pathsToMatch=/api/**

# JPA Optimizations
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
